name: CI

# Cross-platform Rust audio is the #1 place this project breaks, so every
# PR (and every push to main) is built, linted, and tested on all three
# target platforms before it can land.
#
# To make these required, enable branch protection on `main` and select
# the "build (ubuntu-latest)", "build (macos-14)", and "build
# (windows-latest)" checks (and "lint") as required status checks — that
# is a repository setting, not something this file can enforce.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Generate coverage (LCOV)
        # Prints the per-file summary and fails the job if total line
        # coverage drops below the floor — the visible, hard gate. Codecov
        # (below) layers the "no >2pp drop vs base" check on top once a
        # baseline exists. Floor starts below the current baseline (~74%)
        # so it is a real gate without being flaky while stub modules are
        # still being filled in.
        run: cargo llvm-cov --all --lcov --output-path lcov.info --fail-under-lines 60
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: build
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: test
        run: cargo test --all
      - name: build release
        run: cargo build --release
