name: Release

# Pushing a `vX.Y.Z` tag builds release binaries for every supported
# target and attaches them — plus a sha256 per artifact — to a GitHub
# Release. The release is created as a DRAFT so a human reviews and
# publishes it (safer for early cuts). The release body is GitHub's
# auto-generated changelog from commits since the previous tag.
#
# Per the project rule, no version tag is pushed before v0.1.0 is
# accepted; the first end-to-end exercise of this pipeline happens under
# the "First release dry run with rc tag" story using a pre-release tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, name: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, name: darwin-amd64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-amd64 }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              name: linux-arm64,
              cross_linker: gcc-aarch64-linux-gnu,
            }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          if [ -n "${{ matrix.cross_linker }}" ]; then
            sudo apt-get install -y "${{ matrix.cross_linker }}"
          fi

      - name: Configure cross linker (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          pkg="termkrush-${{ matrix.name }}"
          out="target/${{ matrix.target }}/release/termkrush"
          mkdir -p dist
          tar -C "$(dirname "$out")" -czf "dist/${pkg}.tar.gz" termkrush
          ( cd dist && shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256" )

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "termkrush-${{ matrix.name }}"
          $out = "target/${{ matrix.target }}/release/termkrush.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $out -DestinationPath "dist/$pkg.zip"
          $hash = (Get-FileHash "dist/$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkg.zip" | Out-File -Encoding ascii "dist/$pkg.zip.sha256"

      - name: Attach to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
