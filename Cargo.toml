[package]
name = "termkrush"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A keyboard-first terminal scratch/loop mixer: pads, auto-synced loops, old-school scratching, and a tracker timeline — from your shell."
authors = ["Matt Reider <mreider@gmail.com>"]
license = "MIT"
repository = "https://github.com/mreider/termkrush"
homepage = "https://github.com/mreider/termkrush"
readme = "README.md"
keywords = ["dj", "audio", "tui", "music", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "termkrush"
path = "src/main.rs"

# The binary is a thin shell; all engine logic lives in the headless
# `termkrush-core` crate, which carries no UI dependency.
[dependencies]
termkrush-core = { path = "termkrush-core" }
eframe = "0.29"
rtrb = "0.3"
tracing = "0.1"
egui-phosphor = "0.7"   # icon font; 0.7 targets egui 0.29

[workspace]
members = ["termkrush-core"]

[profile.release]
opt-level = 3
lto = true
strip = true

# Optimize *dependencies* even in dev/test builds (the audio DSP deps run
# ~50-80x slower otherwise), while our own crates stay unoptimized for fast
# incremental builds. Applies across the workspace.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
