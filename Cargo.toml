[package]
name = "termkrush"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A keyboard-first terminal DJ application: beat-match, crossfade, scratch, and record from the comfort of your shell."
authors = ["Matt Reider <mreider@gmail.com>"]
license = "MIT"
repository = "https://github.com/mreider/termkrush"
homepage = "https://github.com/mreider/termkrush"
readme = "README.md"
keywords = ["dj", "audio", "tui", "music", "terminal"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "termkrush"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
ratatui = "0.29"
rtrb = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# Decoding: symphonia reads the container + codec; only the formats we use
# are enabled (mp3 for the decode story, wav+pcm for the synthesized fixtures).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
# Resampling: convert a decoded track's sample rate to the output rate.
rubato = "0.16"
# Config file parsing (~/.config/termkrush/config.toml).
toml = "0.8"
# Gamepad input (Xbox is the preferred controller). The mapping layer is
# unit-tested via a normalized PadInput enum; gilrs only feeds it at runtime.
gilrs = "0.11"

[dev-dependencies]
# Property-based testing for the DSP path (gain, crossfade, mix).
proptest = "1"

[profile.release]
opt-level = 3
lto = true
strip = true       # strip symbols at link time — cross-target safe, no external strip

# Optimize *dependencies* even in dev/test builds, while keeping our own
# crate unoptimized (fast incremental builds, debuggable). Without this the
# audio DSP deps (symphonia mp3 decode, rubato/rustfft resampling) run
# ~50-80x slower in debug, turning a track load into a ~60s "stuck" decode.
# Our code stays at the profile's default opt-level so iteration is quick.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
