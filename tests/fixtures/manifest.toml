# Test-audio fixture manifest.
#
# Every file here is SYNTHESIZED by scripts/gen-fixtures.sh — there is no
# third-party audio in this repo, so the whole set is released under
# CC0-1.0 (public-domain dedication) and can be redistributed freely. The
# generator is deterministic; regenerate with `bash scripts/gen-fixtures.sh`
# and the bytes are identical.
#
# Format is WAV (16-bit signed PCM, mono, 44.1 kHz) rather than mp3: the
# project has no mp3 encoder yet, and the decoder (symphonia) reads WAV
# natively. `bpm` is omitted for the non-rhythmic tones; the click tracks
# carry an exact, known tempo so BPM-detection tests have ground truth.

[[fixture]]
name = "sine_a440"
file = "sine_a440_10s.wav"
key = "A"                     # 440 Hz == A4
duration_secs = 10.0
sample_rate = 44100
channels = 1
format = "wav"
source = "synthesized: pure 440 Hz sine, amplitude 0.6"
license = "CC0-1.0"

